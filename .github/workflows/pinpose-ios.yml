# Builds only the PinPose iOS app. Runs only when files under PinPose-iOS/ change,
# so the rest of the repository is not affected.
name: PinPose iOS Build

on:
  push:
    paths:
      - "PinPose-iOS/**"
      - ".github/workflows/pinpose-ios.yml"
  pull_request:
    paths:
      - "PinPose-iOS/**"
      - ".github/workflows/pinpose-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        working-directory: PinPose-iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project PinPose.xcodeproj \
            -scheme PinPose \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Build for iPhone (unsigned)
        working-directory: PinPose-iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project PinPose.xcodeproj \
            -scheme PinPose \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-device.log

      - name: Show compiler errors
        if: failure()
        working-directory: PinPose-iOS
        run: grep -h -E "error:" build*.log | sort -u | head -100 || true
